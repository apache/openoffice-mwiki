github:
  description: "Apache OpenOffice MediaWiki"
  homepage: "https://wiki.openoffice.org/"
  labels:
    - openoffice
    - apache
    - mediawiki

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
notifications:
  commits: commits@openoffice.apache.org
  issues: dev@openoffice.apache.org
  pullrequests: dev@openoffice.apache.org

